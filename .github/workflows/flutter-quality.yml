name: Flutter quality

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: flutter-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.44.7

jobs:
  quality-and-android:
    name: Quality and Android debug build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Configure Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Configure Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Verify frozen OpenAPI client
        run: dart run tool/openapi.dart --from-snapshot --check

      - name: Generate localizations and routes
        run: |
          flutter gen-l10n
          dart run build_runner build

      - name: Verify generated sources are current
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"

      - name: Verify format
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Android debug APK
        run: flutter build apk --debug

  ios-simulator:
    name: iOS simulator build
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Configure Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate localizations and routes
        run: |
          flutter gen-l10n
          dart run build_runner build

      - name: Build iOS simulator app
        run: flutter build ios --simulator --no-codesign
