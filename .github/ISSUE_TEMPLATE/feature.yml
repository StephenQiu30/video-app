name: 功能建议
description: 为 FrameFetch iOS/Android 客户端提出可验证的改进建议
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        FrameFetch 按 Design → PRD → Plan → Acceptance 交付。请先描述用户问题与移动端价值；服务端能力建议应提交到 video-server。

  - type: textarea
    id: problem
    attributes:
      label: 用户问题
      description: 谁在什么场景遇到什么问题？不要只写实现方案。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述期望的原生交互、关键状态与完成标准。
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: 目标平台
      options:
        - iOS 与 Android
        - iOS
        - Android
    validations:
      required: true

  - type: dropdown
    id: server_change
    attributes:
      label: 是否需要 video-server 变化
      options:
        - 不确定
        - 不需要，现有 App 契约足够
        - 需要新的或变更后的服务端契约
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 说明尝试过的现有流程或其他选择。

  - type: textarea
    id: acceptance
    attributes:
      label: 可验证的完成标准
      description: 列出成功、空态、失败、离线、会话过期与辅助功能等相关状态。
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 范围确认
      options:
        - label: 我理解本仓库首期只支持 Android 与 iOS，不包含 Flutter Web 或桌面端。
          required: true
        - label: 此建议不会要求 App 绕过 DRM、平台权限、服务端授权或安全边界。
          required: true
