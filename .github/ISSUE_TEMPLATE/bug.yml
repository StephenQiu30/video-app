name: Bug 报告
description: 报告可复现的 FrameFetch iOS 或 Android 问题
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        感谢你帮助改进 FrameFetch。提交前请搜索已有 Issue，并删除 Token、Cookie、完整媒体 URL、预签名 URL、用户媒体与其他敏感信息。

  - type: dropdown
    id: platform
    attributes:
      label: 平台
      options:
        - iOS
        - Android
        - iOS 与 Android
    validations:
      required: true

  - type: input
    id: app_version
    attributes:
      label: App 版本或提交
      description: 例如 0.1.0+1 或完整 commit SHA
      placeholder: 0.1.0+1 / abcdef0
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: 运行环境
      description: 设备/模拟器、系统版本、Flutter 版本；如相关，请附 video-server 版本
      placeholder: iPhone 17 Pro Simulator, iOS 26.5, Flutter 3.44.7, video-server abcdef0
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请提供最小、稳定的复现步骤，使用脱敏或公开测试数据
      placeholder: |
        1. 启动 App 并登录测试实例
        2. 打开……
        3. 点击……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 脱敏证据
      description: 可附截图、录屏或日志；请先移除账号、Token、媒体标题、完整 URL 与用户内容

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，并确认这不是重复报告。
          required: true
        - label: 我已删除凭据、私有媒体、完整 URL 与其他敏感信息。
          required: true
        - label: 这属于移动 App；API、Web、Provider、队列或 AI Worker 问题应提交到 video-server。
          required: true
