name: framegrab
description: 帧取 iOS 与 Android 客户端
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  dio: ^5.11.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  flutter_secure_storage: ^11.0.0
  flutter_svg: ^2.3.0
  go_router: ^17.5.0
  intl: ^0.20.2

dev_dependencies:
  build_runner: 2.15.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  go_router_builder: ^4.4.0

flutter:
  assets:
    - assets/brand/logo.svg
  generate: true
  uses-material-design: true
