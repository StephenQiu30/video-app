name: framegrab
description: FrameFetch is an open-source Flutter client for self-hosted media workflows and server-side AI video analysis on iOS and Android.
publish_to: "none"
version: 0.1.0+1
homepage: https://github.com/StephenQiu30/video-app#readme
repository: https://github.com/StephenQiu30/video-app
issue_tracker: https://github.com/StephenQiu30/video-app/issues
documentation: https://github.com/StephenQiu30/video-app/tree/main/docs

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  crypto: ^3.0.7
  dio: ^5.11.0
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_file_saver: ^0.10.0
  flutter_localizations:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_riverpod: ^3.4.2
  flutter_secure_storage: ^10.3.1
  flutter_slidable: ^4.0.3
  go_router: ^18.0.0
  intl: ^0.20.2
  lucide_icons_flutter: ^3.1.17
  media_kit: ^1.2.6
  media_kit_libs_video: ^1.0.7
  media_kit_video: ^2.0.1
  one_of: ^1.5.0
  # These releases match the project's current AGP 9 compatibility mode.
  # Upgrade them together with the Android built-in Kotlin migration.
  package_info_plus: 9.0.1
  share_plus: 12.0.1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  video_server_api:
    path: packages/video_server_api
  # See the AGP 9 compatibility note above package_info_plus.
  wakelock_plus: 1.5.2

dev_dependencies:
  build_runner: ^2.16.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  go_router_builder: ^4.4.1
  integration_test:
    sdk: flutter

flutter:
  # media_kit's native iOS libraries are currently CocoaPods-only. Keeping the
  # project on one dependency manager ensures those frameworks are embedded in
  # simulator and device builds instead of being split across Pods and SPM.
  config:
    enable-swift-package-manager: false
  generate: true
  uses-material-design: true
